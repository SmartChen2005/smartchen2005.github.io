name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate static site
        run: |
          node tools/validate-site.mjs
          node tools/test-site-cursor.mjs
          node tools/test-site-icons.mjs
          node tools/test-figures-of-speech.mjs
          node tools/test-camera.mjs
          node tools/test-camera.mjs --archive
          node tools/test-gallery-carousels.mjs
          node tools/test-gallery-layouts.mjs
          node tools/test-home.mjs
          node tools/test-home-loading.mjs
          node tools/test-motor-race.mjs
          node tools/test-home-state.mjs
          node tools/test-photo-transition.mjs
          node tools/test-music-station.mjs
          node tools/test-music-firmware.mjs
          node tools/test-masb.mjs
          node tools/test-vr.mjs
          node tools/test-construction-space.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
