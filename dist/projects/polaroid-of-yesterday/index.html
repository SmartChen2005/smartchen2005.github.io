<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Enter Polaroid of Yesterday: watch the trailer, read the Game Design Document, and explore the project's photography.">
  <title>Polaroid of Yesterday — Smart Chen</title>
  <link rel="preload" as="image" href="assets/room.jpg">
  <link rel="preload" as="font" href="../../assets/fonts/great-vibes-regular.ttf" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="room.css">
  <script type="module" src="room.mjs"></script>
</head>
<body>
  <main class="room" aria-labelledby="project-title">
    <nav class="room-breadcrumb" aria-label="Breadcrumb">
      <a href="../"><span aria-hidden="true">←</span> Projects</a>
    </nav>
    <h1 class="wall-title" id="project-title">Polaroid of Yesterday</h1>
    <img class="room-photograph" src="assets/room.jpg" width="3840" height="2160" alt="A photographed living room: a camera in the foreground, a television on a cabinet, and a person sitting in a red chair beside an open window." fetchpriority="high">
    <a class="gdd-sheet" href="game-design-document/">
      <span class="sheet-pin" aria-hidden="true"></span>
      <span class="sheet-title">Game Design<br>Document</span>
      <span class="sheet-action">Inside the Game <span aria-hidden="true">↗</span></span>
    </a>
    <a class="camera-entrance" href="photography/" target="_blank" rel="noopener noreferrer" aria-label="Stills: screenshots and concept photography (opens in a new tab)">
      <span class="camera-frame" aria-hidden="true"></span>
      <span class="camera-tag">
        <span class="camera-tag-title">Stills <span aria-hidden="true">↗</span></span>
        <span class="camera-tag-caption">Screenshots · Concept Photography</span>
      </span>
    </a>
    <div class="wall-download">
      <button class="download-entrance" type="button" aria-expanded="false" aria-controls="download-note">Download Game <span aria-hidden="true">↓</span></button>
      <span class="download-availability">PC build</span>
      <p class="download-note" id="download-note" hidden role="status">The game download is not available yet.</p>
    </div>
    <section class="tv-anchor" aria-label="Project trailer">
      <div class="tv-projection">
        <div class="tv-screen">
          <iframe class="tv-player" title="Polaroid of Yesterday trailer" src="https://www.youtube.com/embed/-wh1L6NE_BY?si=rFFAzSROkLFqIoHE&amp;autoplay=1&amp;mute=1&amp;controls=1&amp;fs=1&amp;rel=0&amp;playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
