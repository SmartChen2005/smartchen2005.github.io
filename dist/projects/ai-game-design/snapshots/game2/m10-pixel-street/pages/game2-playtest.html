<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151311">
    <meta name="description" content="Play the route currently saved in the Catwalk editor.">
    <title>Catwalk — Route Playtest</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../styles/game2.css?v=14">
    <link rel="stylesheet" href="../styles/game2-playtest.css?v=4">
  </head>
  <body>
    <main class="catwalk-shell">
      <header class="prototype-header">
        <div>
          <p class="prototype-kicker">CATWALK / LIVE EDITOR DATA</p>
          <h1 id="playtest-project-name">Route Playtest</h1>
        </div>
        <nav aria-label="Playtest controls">
          <button id="restart-playtest" type="button">Restart</button>
          <a class="return-editor" href="./game2-editor.html">Return to Editor</a>
          <a href="./game2.html">Prototype Gallery</a>
        </nav>
      </header>

      <section class="desk playtest-desk" aria-label="Catwalk route playtest">
        <aside id="player-dialogue" class="player-dialogue" aria-live="polite" hidden>
          <span>YOU · OUTSIDE THE MONITOR</span>
          <p id="player-dialogue-copy"></p>
        </aside>
        <div class="monitor" aria-label="Platform game monitor">
          <div class="monitor-camera" aria-hidden="true"></div>
          <div id="catwalk-game"></div>
          <div id="screen-interference-layer" class="screen-interference-layer" aria-hidden="true">
            <div id="screen-block-cat" class="screen-block-cat" hidden>
              <div class="screen-cat-silhouette"><i></i></div>
              <span>MOCHA IS BLOCKING THE SCREEN</span>
            </div>
            <div id="screen-walk-cat" class="screen-walk-cat" hidden>
              <div class="screen-cat-silhouette"><i></i></div>
            </div>
          </div>
          <p id="prototype-status" class="sr-only" aria-live="polite"></p>
        </div>
        <div class="monitor-neck" aria-hidden="true"></div>
        <div class="monitor-foot" aria-hidden="true"></div>

        <section id="prototype-keyboard" class="keyboard" aria-label="Full-size ANSI keyboard">
          <p class="keyboard-label">LIVE INPUT · EDITOR PAW EVENTS</p>
          <div id="full-keyboard-layout" class="full-keyboard-layout"></div>
          <div id="dynamic-paws" aria-hidden="true"></div>
        </section>
      </section>

      <section id="missing-project" class="missing-project" hidden>
        <p>No valid Catwalk editor route was found in this browser.</p>
        <a href="./game2-editor.html">Open the editor and save a route</a>
      </section>
    </main>

    <script src="../../shared/phaser.min.js"></script>
    <script src="../scripts/snapshot-route.js"></script>
    <script src="../scripts/game2-level-data.js?v=2"></script>
    <script src="../scripts/game2-editor-model.js?v=8"></script>
    <script src="../scripts/game2-playtest-model.js?v=18"></script>
    <script src="../scripts/game2-playtest.js?v=22"></script>
  </body>
</html>
