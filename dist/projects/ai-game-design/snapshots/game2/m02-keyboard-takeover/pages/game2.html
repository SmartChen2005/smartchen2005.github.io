<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151311">
    <title>Catwalk — Prototype 01</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../styles/game2.css">
  </head>
  <body>
    <main class="catwalk-shell">
      <header class="prototype-header">
        <div>
          <p class="prototype-kicker">CATWALK / PROTOTYPE 01</p>
          <h1>Keyboard takeover</h1>
        </div>
        <nav aria-label="Prototype controls">
          <button id="restart-prototype" type="button">Restart</button>
          <a href="../../../../index.html" target="_top">Home</a>
        </nav>
      </header>

      <section class="desk" aria-label="Catwalk prototype desk">
        <div class="monitor" aria-label="Platform game monitor">
          <div class="monitor-camera" aria-hidden="true"></div>
          <div id="catwalk-game"></div>
          <p id="prototype-status" class="sr-only" aria-live="polite">
            Use WASD to move and jump.
          </p>
        </div>

        <div class="monitor-neck" aria-hidden="true"></div>
        <div class="monitor-foot" aria-hidden="true"></div>

        <section id="prototype-keyboard" class="keyboard" aria-label="Visible keyboard controls">
          <p class="keyboard-label">YOUR KEYBOARD</p>

          <div class="key-zone key-zone-wasd" aria-label="WASD controls">
            <div class="key-row key-row-single">
              <kbd data-key="w">W</kbd>
            </div>
            <div class="key-row">
              <kbd data-key="a">A</kbd>
              <kbd data-key="s">S</kbd>
              <kbd data-key="d">D</kbd>
            </div>
          </div>

          <div class="decorative-keys" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>

          <div class="key-zone key-zone-arrows" aria-label="Arrow key controls">
            <div class="key-row key-row-single">
              <kbd data-key="arrowup">↑</kbd>
            </div>
            <div class="key-row">
              <kbd data-key="arrowleft">←</kbd>
              <kbd data-key="arrowdown">↓</kbd>
              <kbd data-key="arrowright">→</kbd>
            </div>
          </div>

          <div class="moka" aria-hidden="true">
            <div class="moka-head">
              <i class="ear ear-left"></i>
              <i class="ear ear-right"></i>
              <i class="eye eye-left"></i>
              <i class="eye eye-right"></i>
            </div>
            <div class="moka-leg"></div>
            <div class="moka-paw">
              <i></i><i></i><i></i>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="../../shared/phaser.min.js"></script>
    <script src="../scripts/game2.js"></script>
  </body>
</html>
